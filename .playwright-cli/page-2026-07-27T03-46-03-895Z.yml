          - heading "Postcards Between Us" [level=3] [ref=e331]
          - paragraph [ref=e332]: It turns the most defensible Lovely Sunday truth—two friends, personal style, real places, and a deep archive—into one coherent verbal and visual mechanism. Unlike a generic quiet-luxury treatment, the paired-frame system can make friendship and memory recognizable before the wordmark appears.
